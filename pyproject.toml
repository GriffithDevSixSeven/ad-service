[project]
name = "ad-service"
version = "0.1.0"
description = "Ad service"
readme = "README.md"
authors = [
    { name = "brudskoy", email = "you@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "email-validator>=2.3.0",
    "alembic>=1.20.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.33",
    "bcrypt>=5.0.0",
]

[project.scripts]
ad-service = "ad_service:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

